<!doctype html>
<html lang="en" data-page="downloads">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloads</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="downloads.css">
</head>
<body>
<div class="page">
  <header class="bar">
    <h1 class="heading"><img class="mark" src="magpie.png" alt=""><span class="brand">Magpie</span> Downloads</h1>
    <input id="search" class="search" type="search" placeholder="Search downloads" autocomplete="off" autofocus>
    <button id="clear" class="button" type="button">Clear list</button>
  </header>
  <nav class="pills" aria-label="Filter">
    <button class="pill" type="button" data-filter="all" aria-pressed="true">All</button>
    <button class="pill" type="button" data-filter="active" aria-pressed="false">Active</button>
    <button class="pill" type="button" data-filter="completed" aria-pressed="false">Completed</button>
  </nav>
  <main id="downloads"></main>
  <p id="empty" class="empty" hidden></p>
</div>
<script src="shared.js"></script>
<script src="downloads.js"></script>
</body>
</html>
