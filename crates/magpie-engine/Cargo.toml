[package]
name = "magpie-engine"
version = "0.1.1"
edition = "2024"
description = "Magpie's platform-independent engines: tracker stripping, ad blocking and the Bitwarden vault"
license = "MIT"
repository.workspace = true
authors.workspace = true

[dependencies]
adblock = { workspace = true }
aes = "0.8"
argon2 = "0.5"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
psl = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = "3.5"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
