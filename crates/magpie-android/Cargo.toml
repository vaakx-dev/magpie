[package]
name = "magpie-android"
version = "0.1.0"
edition = "2024"
description = "JNI bridge from Magpie's Android app to its Rust engines"
license = "MIT"
repository.workspace = true
authors.workspace = true

[lib]
name = "magpie_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
magpie-engine = { path = "../magpie-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
zeroize = "1"
