name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_code=$(date -u +%y%m%d%H)" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build-release.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/Magpie-${{ needs.version.outputs.version }}-setup.exe
            dist/Magpie-${{ needs.version.outputs.version }}-windows-x64.exe
            dist/Magpie-${{ needs.version.outputs.version }}-windows-x64.zip

  android:
    needs: [version, test]
    runs-on: windows-latest
    env:
      APK: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust libraries
        run: powershell -ExecutionPolicy Bypass -File android\build-rust.ps1
      - name: Decode keystore
        shell: bash
        env:
          MAGPIE_KEYSTORE_BASE64: ${{ secrets.MAGPIE_KEYSTORE_BASE64 }}
        run: |
          echo "$MAGPIE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magpie-release.jks"
          echo "MAGPIE_KEYSTORE_PATH=$RUNNER_TEMP/magpie-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        env:
          MAGPIE_KEYSTORE_PASSWORD: ${{ secrets.MAGPIE_KEYSTORE_PASSWORD }}
          MAGPIE_KEY_ALIAS: ${{ secrets.MAGPIE_KEY_ALIAS }}
          MAGPIE_KEY_PASSWORD: ${{ secrets.MAGPIE_KEY_PASSWORD }}
        run: >-
          .\gradlew.bat :app:assembleRelease
          "-PmagpieVersionCode=${{ needs.version.outputs.version_code }}"
      - name: Name APK
        shell: bash
        run: mv "$APK" "Magpie-${{ needs.version.outputs.version }}-android-arm64-v8a.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: android
          if-no-files-found: error
          path: Magpie-${{ needs.version.outputs.version }}-android-arm64-v8a.apk

  publish:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Write checksums
        working-directory: assets
        run: sha256sum Magpie-* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* --title "Magpie ${TAG#v}" --generate-notes --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
